<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Hub</title>
  <!-- 引入 EB Garamond 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:          #000000;
      --accent-white: #ffffff;
      --text:        #ffffff;
      --text-muted:  #444444;
      --font-serif:  'EB Garamond', serif;
      --transition:  0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 80px 24px;
      overflow: hidden;
    }

    /* ── Breathing Animation ── */
    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .breathing {
      animation: breathe 6s ease-in-out infinite;
    }

    /* ── Top Search Bar ── */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 120px;
    }

    .search-container {
      width: 100%;
      max-width: 400px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid var(--accent-white);
      padding: 0 15px;
      height: 38px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: var(--font-serif);
      letter-spacing: 0.05em;
      text-align: center; /* 搜索文字居中 */
    }

    /* ── Main Content ── */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 80px; /* 增加链接与眼睛之间的呼吸感 */
      margin-top: -100px; /* 整体向上偏移，增加视觉重心 */
    }

    .links-row {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.02em;
      transition: opacity var(--transition);
      opacity: 0.8;
    }

    .link-card:hover {
      opacity: 0.4;
    }

    .link-icon {
      width: 13px;
      height: 13px;
      filter: grayscale(1) invert(0.9);
      object-fit: contain;
    }

    /* ── All-Seeing Eye ── */
    .eye-section {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .eye {
      width: 70px;
      height: 40px;
      background: transparent;
      border: 1.2px solid var(--accent-white);
      border-radius: 75% 0;
      transform: rotate(45deg);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pupil-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(-45deg);
    }

    .pupil {
      width: 16px;
      height: 16px;
      background: var(--accent-white);
      border-radius: 50%;
      position: relative;
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 40px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.4em;
      text-transform: lowercase;
      font-family: var(--font-serif);
    }
  </style>
</head>
<body>

  <!-- ── Top Search Section ── -->
  <div class="header-section">
    <div class="search-container breathing">
      <form id="search-form" class="search-form" action="https://www.bing.com/search" method="get" target="_blank">
        <input id="search-input" class="search-input" type="text" name="q" autocomplete="off" autofocus />
      </form>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="content-wrapper">
    <nav class="links-row">
      <a class="link-card" href="https://manus.im" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=manus.im&sz=64"> manus
      </a>
      <a class="link-card" href="https://gemini.google.com" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64"> gemini
      </a>
      <a class="link-card" href="https://chatgpt.com" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64"> chatgpt
      </a>
      <a class="link-card" href="https://github.com" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=github.com&sz=64"> github
      </a>
      <a class="link-card" href="https://pinterest.com" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=pinterest.com&sz=64"> pinterest
      </a>
      <a class="link-card" href="https://congyu.moe/" target="_blank">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=congyu.moe&sz=64"> congyu
      </a>
    </nav>

    <!-- ── The All-Seeing Eye ── -->
    <div class="eye-section breathing">
      <div class="eye">
        <div class="pupil-wrap">
          <div id="pupil" class="pupil"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>rin</footer>

  <script>
    // --- Eye Tracking Logic ---
    const pupil = document.getElementById('pupil');
    document.addEventListener('mousemove', (e) => {
      const rect = pupil.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      
      const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
      const distance = Math.min(8, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 35);
      
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      
      pupil.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>

</body>
</html>
