<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Rin · 搜索与导航</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --accent-white: #ffffff;
      --text: #ffffff;
      --text-muted: #888888;
      --font-serif: 'EB Garamond', serif;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 80px 24px 40px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .breathing {
      animation: breathe 6s ease-in-out infinite;
    }

    .header-section {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 120px;
      flex-shrink: 0;
    }

    .search-container {
      width: 100%;
      max-width: 400px;
    }

    /* 输入或悬停时停止呼吸，保持文字和焦点清晰。 */
    .search-container:hover,
    .search-container:focus-within {
      animation: none;
      opacity: 1;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid var(--accent-white);
      padding: 0 15px;
      min-height: 44px;
    }

    .search-form:focus-within {
      outline: 2px solid var(--accent-white);
      outline-offset: 4px;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      font-family: var(--font-serif);
      letter-spacing: 0.05em;
      text-align: left;
    }

    .search-input::placeholder {
      color: #aaaaaa;
      opacity: 1;
    }

    .content-wrapper {
      width: 100%;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 80px;
      margin-top: -100px;
      padding-block: 44px;
    }

    .links-row {
      display: flex;
      gap: 8px 25px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 100%;
    }

    .link-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      min-width: 44px;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.02em;
      transition: opacity var(--transition);
      opacity: 0.8;
    }

    .link-card:hover { opacity: 0.4; }

    .link-card:focus-visible {
      outline: 2px solid var(--accent-white);
      outline-offset: 4px;
      opacity: 1;
    }

    .link-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      filter: grayscale(1) invert(0.9);
      object-fit: contain;
    }

    .eye-section {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .eye {
      width: 70px;
      height: 40px;
      background: transparent;
      border: 1.2px solid var(--accent-white);
      border-radius: 75% 0;
      transform: rotate(45deg);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .pupil-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(-45deg);
    }

    .pupil {
      width: 16px;
      height: 16px;
      background: var(--accent-white);
      border-radius: 50%;
      position: relative;
    }

    footer {
      flex-shrink: 0;
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.4em;
      text-transform: lowercase;
    }

    @media (max-width: 600px), (max-height: 600px) {
      body { padding: 40px 20px 24px; }
      .header-section { margin-bottom: 48px; }
      .content-wrapper {
        margin-top: 0;
        gap: 48px;
        padding-block: 24px;
      }
      .links-row { gap: 8px 20px; }
      footer { margin-top: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breathing { animation: none; opacity: 1; }
      .link-card { transition: none; }
    }
  </style>
</head>
<body>
  <header class="header-section">
    <div class="search-container breathing">
      <form id="search-form" class="search-form" role="search"
        aria-label="Bing 搜索" action="https://www.bing.com/search"
        method="get" target="_blank" rel="noopener noreferrer">
        <label class="sr-only" for="search-input">搜索关键词</label>
        <input id="search-input" class="search-input" type="search" name="q"
          placeholder="使用 Bing 搜索…" autocomplete="off" enterkeyhint="search"
          aria-describedby="search-help" required />
        <span id="search-help" class="sr-only">输入关键词后按回车搜索，结果将在新标签页打开。</span>
      </form>
    </div>
  </header>

  <main class="content-wrapper">
    <h1 class="sr-only">Rin · 搜索与导航</h1>
    <nav class="links-row" aria-label="常用网站">
      <!-- 图标与相邻文字重复，使用空 alt 避免屏幕阅读器重复朗读。 -->
      <a class="link-card" href="https://manus.im" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=manus.im&sz=64" alt="" width="13" height="13" /> manus
        <span class="sr-only">（在新标签页打开）</span>
      </a>
      <a class="link-card" href="https://gemini.google.com" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64" alt="" width="13" height="13" /> gemini
        <span class="sr-only">（在新标签页打开）</span>
      </a>
      <a class="link-card" href="https://chatgpt.com" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64" alt="" width="13" height="13" /> chatgpt
        <span class="sr-only">（在新标签页打开）</span>
      </a>
      <a class="link-card" href="https://github.com" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="" width="13" height="13" /> github
        <span class="sr-only">（在新标签页打开）</span>
      </a>
      <a class="link-card" href="https://pinterest.com" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=pinterest.com&sz=64" alt="" width="13" height="13" /> pinterest
        <span class="sr-only">（在新标签页打开）</span>
      </a>
      <a class="link-card" href="https://congyu.moe/" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="https://www.google.com/s2/favicons?domain=congyu.moe&sz=64" alt="" width="13" height="13" /> congyu
        <span class="sr-only">（在新标签页打开）</span>
      </a>
    </nav>

    <div class="eye-section breathing" aria-hidden="true">
      <div id="eye" class="eye">
        <div class="pupil-wrap">
          <div id="pupil" class="pupil"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>rin</footer>

  <script>
    (() => {
      const eye = document.getElementById('eye');
      const pupil = document.getElementById('pupil');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let frame = null;
      let pointerX = 0;
      let pointerY = 0;

      function resetPupil() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        pupil.style.transform = 'translate(0px, 0px)';
      }

      function updatePupil() {
        frame = null;
        if (reducedMotion.matches) return;
        // 使用眼眶中心，避免瞳孔移动改变下一次计算的参照点。
        const rect = eye.getBoundingClientRect();
        const dx = pointerX - (rect.left + rect.width / 2);
        const dy = pointerY - (rect.top + rect.height / 2);
        const angle = Math.atan2(dy, dx);
        const distance = Math.min(8, Math.hypot(dx, dy) / 35);
        pupil.style.transform =
          `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
      }

      document.addEventListener('pointermove', (event) => {
        // 触屏滚动不驱动眼睛，避免干扰页面操作。
        if (event.pointerType === 'touch' || reducedMotion.matches) return;
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (frame === null) frame = requestAnimationFrame(updatePupil);
      }, { passive: true });

      document.documentElement.addEventListener('pointerleave', resetPupil);
      window.addEventListener('blur', resetPupil);
      reducedMotion.addEventListener('change', resetPupil);
    })();
  </script>
</body>
</html>
